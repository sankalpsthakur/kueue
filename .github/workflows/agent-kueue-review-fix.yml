name: Agent Kueue review fix

on:
  push:
    branches:
      - automation/kueue-14178-review-fix

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewer refactor
        shell: bash
        run: |
          cat > pkg/scheduler/preemption/preempted_workloads.go <<'EOF'
          /*
          Copyright The Kubernetes Authors.

          Licensed under the Apache License, Version 2.0 (the "License");
          you may not use this file except in compliance with the License.
          You may obtain a copy of the License at

              http://www.apache.org/licenses/LICENSE-2.0

          Unless required by applicable law or agreed to in writing, software
          distributed under the License is distributed on an "AS IS" BASIS,
          WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          See the License for the specific language governing permissions and
          limitations under the License.
          */

          package preemption

          import (
          	"maps"
          	"slices"

          	"sigs.k8s.io/kueue/pkg/workload"
          )

          type PreemptedWorkloads map[workload.Reference]*workload.Info

          func (p PreemptedWorkloads) HasAny(newTargets []*Target) bool {
          	for _, target := range newTargets {
          		if _, found := p[workload.Key(target.WorkloadInfo.Obj)]; found {
          			return true
          		}
          	}
          	return false
          }

          func (p PreemptedWorkloads) Insert(newTargets []*Target) {
          	for _, target := range newTargets {
          		p[workload.Key(target.WorkloadInfo.Obj)] = target.WorkloadInfo
          	}
          }

          // WorkloadsToRemove returns the union of workloads already preempted in this
          // scheduling cycle and the new preemption targets, deduplicated by workload key.
          // The receiver is not mutated.
          func (p PreemptedWorkloads) WorkloadsToRemove(newTargets []*Target) []*workload.Info {
          	merged := maps.Clone(p)
          	if merged == nil {
          		merged = make(PreemptedWorkloads, len(newTargets))
          	}
          	merged.Insert(newTargets)
          	return slices.Collect(maps.Values(merged))
          }
          EOF

          cat > pkg/scheduler/preemption/preempted_workloads_test.go <<'EOF'
          /*
          Copyright The Kubernetes Authors.

          Licensed under the Apache License, Version 2.0 (the "License");
          you may not use this file except in compliance with the License.
          You may obtain a copy of the License at

              http://www.apache.org/licenses/LICENSE-2.0

          Unless required by applicable law or agreed to in writing, software
          distributed under the License is distributed on an "AS IS" BASIS,
          WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          See the License for the specific language governing permissions and
          limitations under the License.
          */

          package preemption

          import (
          	"testing"

          	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"

          	kueue "sigs.k8s.io/kueue/apis/kueue/v1beta2"
          	"sigs.k8s.io/kueue/pkg/workload"
          )

          func TestWorkloadsToRemove(t *testing.T) {
          	original := workloadInfoForTest("ns", "victim-a")
          	replacement := workloadInfoForTest("ns", "victim-a")
          	additional := workloadInfoForTest("ns", "victim-b")
          	originalKey := workload.Key(original.Obj)
          	additionalKey := workload.Key(additional.Obj)

          	preempted := PreemptedWorkloads{originalKey: original}
          	got := preempted.WorkloadsToRemove([]*Target{
          		{WorkloadInfo: replacement},
          		{WorkloadInfo: additional},
          	})

          	if len(got) != 2 {
          		t.Fatalf("WorkloadsToRemove() returned %d workloads, want 2", len(got))
          	}
          	gotByKey := make(PreemptedWorkloads, len(got))
          	for _, info := range got {
          		gotByKey[workload.Key(info.Obj)] = info
          	}
          	if gotByKey[originalKey] != replacement {
          		t.Errorf("duplicate target was not deduplicated with the new target value")
          	}
          	if gotByKey[additionalKey] != additional {
          		t.Errorf("new target was not included")
          	}
          	if len(preempted) != 1 || preempted[originalKey] != original {
          		t.Errorf("WorkloadsToRemove() mutated receiver: %#v", preempted)
          	}
          }

          func TestWorkloadsToRemoveNilReceiver(t *testing.T) {
          	target := workloadInfoForTest("ns", "victim")
          	var preempted PreemptedWorkloads

          	got := preempted.WorkloadsToRemove([]*Target{{WorkloadInfo: target}})
          	if len(got) != 1 || workload.Key(got[0].Obj) != workload.Key(target.Obj) {
          		t.Fatalf("WorkloadsToRemove() = %#v, want the target workload", got)
          	}
          }

          func workloadInfoForTest(namespace, name string) *workload.Info {
          	return &workload.Info{Obj: &kueue.Workload{ObjectMeta: metav1.ObjectMeta{Namespace: namespace, Name: name}}}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("pkg/scheduler/scheduler.go")
          text = path.read_text()
          start = text.index("func fits(snapshot *schdcache.Snapshot")
          end = text.index("\n// resourcesToReserve", start)
          replacement = '''func fits(snapshot *schdcache.Snapshot, cq *schdcache.ClusterQueueSnapshot, usage *workload.Usage, preemptedWorkloads preemption.PreemptedWorkloads,
          \tnewTargets []*preemption.Target) schdcache.FitsCheck {
          \tworkloads := preemptedWorkloads.WorkloadsToRemove(newTargets)
          \trevertUsage := snapshot.SimulateWorkloadRemoval(workloads)
          \tdefer revertUsage()
          \treturn cq.Fits(*usage)
          }
          '''
          text = text[:start] + replacement + text[end:]
          if "maps." not in text:
              text = text.replace('\t"maps"\n', '')
          if "slices." not in text:
              text = text.replace('\t"slices"\n', '')
          path.write_text(text)
          PY

          gofmt -w pkg/scheduler/scheduler.go pkg/scheduler/preemption/preempted_workloads.go pkg/scheduler/preemption/preempted_workloads_test.go

      - name: Focused tests
        shell: bash
        run: |
          go test ./pkg/scheduler/preemption -run 'TestWorkloadsToRemove' -count=1
          go test ./pkg/scheduler -run 'TestFitsDedupsOverlappingVictims$' -count=1

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/scheduler/scheduler.go pkg/scheduler/preemption/preempted_workloads.go pkg/scheduler/preemption/preempted_workloads_test.go
          git diff --cached --check
          git commit -m "refactor(scheduler): centralize preempted workload merge"
          git push origin HEAD:automation/kueue-14178-review-fix
